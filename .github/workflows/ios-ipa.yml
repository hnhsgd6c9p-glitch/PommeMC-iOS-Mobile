name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - ios-ipa-cloud-build

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust and cached dependencies
        uses: ./.github/actions/setup-rust
        with:
          cache-key: ios-ipa-fabric

      - name: Add iOS device target
        run: rustup target add aarch64-apple-ios

      - name: Set up Java 21 for compiled-Java fixtures
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Test JVM and Java mod runtime
        run: cargo test -p pomme-jvm -p pomme-mod

      - name: Install XcodeGen and pkg-config
        run: brew install xcodegen pkg-config

      - name: Generate Xcode project
        working-directory: pomme-ios
        run: xcodegen generate

      - name: Build unsigned iOS app
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGN_IDENTITY: ""
        run: |
          xcodebuild -quiet \
            -project pomme-ios/Pomme.xcodeproj \
            -scheme Pomme \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath target/ios-cloud-build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA for LiveContainer
        run: |
          set -euo pipefail
          APP="target/ios-cloud-build/Build/Products/Release-iphoneos/Pomme.app"
          test -d "$APP"
          mkdir -p target/ipa/Payload
          cp -R "$APP" target/ipa/Payload/Pomme.app
          cd target/ipa
          /usr/bin/zip -qry ../Pomme-unsigned.ipa Payload
          cd ../..
          shasum -a 256 target/Pomme-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pomme-unsigned-iOS-IPA
          path: target/Pomme-unsigned.ipa
          if-no-files-found: error
          retention-days: 3
