name: iOS IPA — validate fixes

on:
  workflow_dispatch:
  push:
    branches:
      - ios-ipa-cloud-build
    paths:
      - 'pomme-auth/**'
      - 'pomme-client/**'
      - 'pomme-ios/**'
      - 'third_party/SteelMC'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ios-ipa-validated.yml'
      - '.github/actions/setup-rust/**'
      - 'tools/fetch_moltenvk.py'
      - 'tools/build_openal.py'

permissions:
  contents: read

concurrency:
  group: ios-ipa-validated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust and cached dependencies
        uses: ./.github/actions/setup-rust
        with:
          cache-key: ios-fix-tests

      - name: Run auth tests
        run: cargo test -p pomme-auth --all-features

      - name: Run client tests
        run: cargo test -p pomme-client --no-default-features --lib

      - name: Check formatting
        run: cargo fmt --all -- --check

  build-ipa:
    needs: tests
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust and cached dependencies
        uses: ./.github/actions/setup-rust
        with:
          cache-key: ios-fix-ipa

      - name: Add iOS device target
        run: rustup target add aarch64-apple-ios

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: pomme-ios
        run: xcodegen generate

      - name: Build unsigned iOS app
        env:
          CODE_SIGNING_ALLOWED: 'NO'
          CODE_SIGNING_REQUIRED: 'NO'
          CODE_SIGN_IDENTITY: ''
        run: |
          set -euo pipefail
          xcodebuild -quiet \
            -project pomme-ios/Pomme.xcodeproj \
            -scheme Pomme \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath target/ios-validated-build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package and verify IPA
        run: |
          set -euo pipefail
          APP='target/ios-validated-build/Build/Products/Release-iphoneos/Pomme.app'
          test -d "$APP"
          test -x "$APP/Pomme"
          mkdir -p target/ipa/Payload
          cp -R "$APP" target/ipa/Payload/Pomme.app
          (cd target/ipa && /usr/bin/zip -qry ../Pomme-unsigned.ipa Payload)
          unzip -t target/Pomme-unsigned.ipa
          shasum -a 256 target/Pomme-unsigned.ipa

      - name: Upload validated IPA
        uses: actions/upload-artifact@v4
        with:
          name: Pomme-iOS-fixed-unsigned-IPA
          path: target/Pomme-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
