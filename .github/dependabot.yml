version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      azalea:
        patterns:
          - "azalea-*"
      vulkan:
        patterns:
          - "ash"
          - "ash-window"
          - "gpu-allocator"
