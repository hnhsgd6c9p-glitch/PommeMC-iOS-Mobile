name: Set up Rust
description: >-
  The pinned Rust toolchain, a cargo cache, just and cargo-nextest, the Vulkan
  SDK where needed and, on Linux, the system libraries the client links.

inputs:
  cache-key:
    description: The rust-cache key, one per job so each keeps its own build.
    required: true

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: nightly-2026-08-21
        components: clippy, rustfmt, rust-analyzer, rust-src

    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.cache-key }}
        cache-on-failure: true

    # The checks themselves are `just` recipes, which `just client-pre-pr`
    # runs locally too.
    - uses: taiki-e/install-action@v2
      with:
        tool: just,cargo-nextest

    - name: Install Vulkan SDK
      if: runner.os != 'macOS'
      uses: jakoch/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa
      with:
        vulkan_version: 1.4.341.0
        install_runtime: false
        cache: true
        stripdown: true

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libvulkan-dev cmake libxkbcommon-dev libwayland-dev libasound2-dev libudev-dev libdbus-1-dev
